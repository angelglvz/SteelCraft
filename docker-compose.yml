# SteelCraft - PostgreSQL para desarrollo local.
# Uso:   docker compose up -d        (arrancar)
#        docker compose down         (parar; los datos SE CONSERVAN en el volumen)
#        docker compose down -v      (¡BORRA los datos!)
services:
  db:
    image: postgres:17            # fija la versión mayor; no uses "latest"
    container_name: steelcraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"     # solo accesible desde tu propio equipo
    volumes:
      - steelcraft_pgdata:/var/lib/postgresql/data   # aquí viven los datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  steelcraft_pgdata: